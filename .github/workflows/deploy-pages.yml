name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'index.html'
      - '.github/docker/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build website image
        run: docker build -f .github/docker/Dockerfile -t website:pages .

      - name: Extract generated website
        run: |
          container=$(docker create website:pages)
          trap 'docker rm "$container"' EXIT
          mkdir -p _site
          docker cp "$container:/usr/share/nginx/html/." _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
